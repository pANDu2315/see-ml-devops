name: CI Pipeline
on: [push]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Docker Login
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build Image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/mnist-ml -f docker/Dockerfile .

      - name: Push Image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/mnist-ml
